<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <h2>Job Application</h2>
        <lable for="name">Name:-</lable>
        <input type="text" id="name" name="name">
        <br>
        <br>
           <lable for="pnumber">phone Number:-</lable>
        <input type="tel" id="pnumber" name="pnumber">
        <br>
        <br>

        <input type="file" id="fileUpload" name="fileUpload">
        <br>
        <br>
        <label for="counter">Experience(in years)..</label>
        <input type="number" name="counter" id="counter" min="0" max="50">
        <br>
        <br>
        <!-- use fieldset -->
        
<fieldset>

    <input type="checkbox" name="checkbox" id="checkbox2">
     <label for="checkbox2">CSS</label>

     
    <input type="checkbox" name="checkbox" id="checkbox3">
    <label for="checkbox3">JavaScript</label>

   
    <input type="checkbox" name="checkbox" id="checkbox4">
      <label for="checkbox4">Python</label> 
</fieldset>
<br>
   <label for="educationType">Highest Education:</label>
    <select name="educationType" id="educationType">
        <option value="a">Education</option>

        <option value="a">B</option>
        <option value="a">C</option>
        <option value="a">D</option>
        <option value="a">E</option>
    </select>
   <br>

    <legend>Availability:</legend>

    <br>
        <label for=""radio2"> Part-time</label>
    <input type="radio" name="availability" id="radio2">
    <br>
   </fieldset>

   <br>

</html>
