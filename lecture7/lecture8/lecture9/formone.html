<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <h1>Event Registration</h1>
    <form>
        <label> Student Name:-</label>
        <input type="text" name="studentname" placeholder="Enter your Name">
        <br>
        <br>
        <label> Student Email:-</label>
        <input type="email" name="studentemail" placeholder="Enter your Email"> 
        <br>
        <br>
        <label> Student Phone:-</label>
        <input type="tel" name="studentphone" placeholder="Enter your Phone Number">
     <br>
     <br>
     <label for="occupationType">Occupation Type:-</label>
    <select name="occupationType" id="occupationType">
        <option value="student">Student</option>
        <option value="professional">Professional</option>
        <option value="other">other</option>
    </select>
<br>
<br>
   

<fieldset>
    <legend>Topic of Interested</legend>

    <label for="checkbox1">HTML</label>
    <input type="checkbox" name="checkbox" id="checkbox1">

     <label for="checkbox2">CSS</label>
    <input type="checkbox" name="checkbox" id="checkbox2">

     <label for="checkbox3">JavaScript</label>
    <input type="checkbox" name="checkbox" id="checkbox3">

     <label for="checkbox4">Python</label>
    <input type="checkbox" name="checkbox" id="checkbox4">
    

</fieldset>

<label for="textarea1">Comments</label>
<br>
<textarea name="textarea1" id="textarea1" cols="30" rows="10"></textarea>
<input type="submit" value="Register">

    </form>
</body>
</html>
